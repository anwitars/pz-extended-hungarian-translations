name: Build Mod

on:
  push:
    tags:
      - "*"

permissions:
  contents: write

jobs:
  build:
    name: Build Project Zomboid Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq

      - name: Get version
        id: version
        run: |
          VERSION=$(./version.sh)
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Build mod
        run: |
          ./build.sh "extended-hungarian-translations-${{ steps.version.outputs.version }}.tar.gz"

      - name: Upload mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: extended-hungarian-translations-${{ steps.version.outputs.version }}
          path: extended-hungarian-translations-${{ steps.version.outputs.version }}.tar.gz
          if-no-files-found: error
          retention-days: 14

      - name: Install git-cliff
        uses: taiki-e/install-action@v2
        with:
          tool: git-cliff

      - name: Generate release notes
        run: git-cliff --current --tag "${GITHUB_REF_NAME}" --output release-notes.md

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
          ARCHIVE: extended-hungarian-translations-${{ steps.version.outputs.version }}.tar.gz
        run: |
          gh release create "${GITHUB_REF_NAME}" "$ARCHIVE" \
            --title "${GITHUB_REF_NAME}" \
            --notes-file release-notes.md
